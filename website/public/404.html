<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Machine Learning — Appunti interattivi</title>
    <script>
      // GitHub Pages serve questa pagina per ogni percorso senza un file dietro.
      // Si passa la richiesta all'applicazione, che la riscrive nell'indirizzo vero (src/lib/router.ts):
      //   /repo/lezione/03/bias → /repo/#/lezione/03/bias → /repo/lezione/03/#bias
      ;(function () {
        var parts = location.pathname.split('/').filter(Boolean)
        var base = '/'
        if (/\.github\.io$/.test(location.hostname) && parts.length) base = '/' + parts.shift() + '/'
        if (parts[parts.length - 1] === 'index.html') parts.pop()
        // gli indirizzi sotto /en/ aprono il sito in inglese
        if (parts[0] === 'en') {
          parts.shift()
          base += 'en/'
        }
        location.replace(base + '#/' + parts.join('/'))
      })()
    </script>
  </head>
  <body></body>
</html>
