<!doctype html>
<html lang="it" data-root="./">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131311" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // applica tema e stile prima del primo paint, per evitare il lampo di colore sbagliato
      ;(function () {
        try {
          var t = localStorage.getItem('ml-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
          document.documentElement.dataset.style = localStorage.getItem('ml-style') === 'classic' ? 'classic' : 'glass'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.style = 'glass'
        }
        // lingua: la decide l'indirizzo (le pagine inglesi stanno sotto en/, vedi src/lib/i18n.ts).
        // Da un indirizzo italiano si passa a quello inglese se lo chiede ?lang=en, la scelta salvata o,
        // senza una scelta, la lingua del browser (non per i crawler, che devono leggere la pagina richiesta).
        var root = new URL(document.documentElement.dataset.root || './', location.href).pathname
        var rest = location.pathname.slice(root.length)
        var l = /^en(\/|$)/.test(rest) ? 'en' : 'it'
        var want = null
        try {
          want = new URLSearchParams(location.search).get('lang')
          if (want === 'it' || want === 'en') localStorage.setItem('ml-lang', want)
          else want = localStorage.getItem('ml-lang')
        } catch (e) {
          /* storage non disponibile */
        }
        var asked = /[?&]lang=(it|en)\b/.test(location.search)
        if (want !== 'it' && want !== 'en') {
          var bot = /bot|crawl|spider|slurp|preview|facebookexternalhit|whatsapp|lighthouse/i.test(navigator.userAgent)
          want = bot || /^it\b/i.test(navigator.language || 'it') ? 'it' : 'en'
        }
        if (l === 'it' && want === 'en') location.replace(root + 'en/' + rest + location.hash)
        else if (l === 'en' && want === 'it' && asked) location.replace(root + rest.replace(/^en\/?/, '') + location.hash)
        document.documentElement.lang = l
        // icone e manifest hanno un percorso relativo: lo si rende assoluto, perché l'indirizzo della pagina
        // cambia quando si naviga senza ricaricare (src/lib/router.ts)
        var links = document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"], link[rel="manifest"]')
        for (var i = 0; i < links.length; i++) links[i].href = links[i].href
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
