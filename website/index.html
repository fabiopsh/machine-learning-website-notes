<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Appunti interattivi del corso di Machine Learning (654AA) — Università di Pisa, a.a. 2026/27." />
    <meta name="color-scheme" content="light dark" />
    <title>Machine Learning — Appunti interattivi</title>
    <script>
      // applica tema e stile prima del primo paint, per evitare il lampo di colore sbagliato
      ;(function () {
        try {
          var t = localStorage.getItem('ml-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
          document.documentElement.dataset.style = localStorage.getItem('ml-style') === 'glass' ? 'glass' : 'classic'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.style = 'classic'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
